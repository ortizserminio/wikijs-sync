name: Construir y publicar imagen

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # Permisos que necesita el job para subir la imagen al registry de GitHub (GHCR)
    permissions:
      contents: read
      packages: write

    steps:
      # 1. Descarga el código (para tener el Dockerfile y wikijs_sync)
      - uses: actions/checkout@v4

      # 2. Inicia sesión en el Container Registry de GitHub (GHCR).
      #    GITHUB_TOKEN es un token que GitHub crea solo para este job; no hay que
      #    crearlo a mano. Con el permiso packages:write de arriba, puede subir imágenes.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. Construye la imagen desde el Dockerfile y la sube a GHCR.
      #    La etiqueta en minúsculas: ghcr.io/ortizserminio/wikijs-sync:latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/ortizserminio/wikijs-sync:latest

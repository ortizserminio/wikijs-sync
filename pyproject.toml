[project]
name = "wikijs-sync"
version = "0.2.0"
description = "Sincroniza ficheros Markdown de un repositorio con Wiki.js vía su API GraphQL."
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.scripts]
wikijs-sync = "wikijs_sync.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["wikijs_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "PIE", "SIM", "RUF"]
ignore = [
    "BLE001",  # Permitimos except Exception en cli.py y sync.py (es intencional)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # Permitimos líneas largas en tests
